<div class="glass" style="padding:18px;margin-bottom:16px"><div id="time" style="font-size:10px;opacity:0.5"></div><div style="font-family:'Syne';font-size:42px" id="temp">--°C</div><div id="city">Loading...</div></div>

<div class="glass tool" data-tool="ip">🌐 My IP</div><div class="glass tool" data-tool="pass">🔑 Password</div><div class="glass tool" data-tool="qr">⚡ QR Maker</div><div class="glass tool" data-tool="calc">🧮 Calculator</div><div class="glass tool" data-tool="age">🎂 Age Calc</div><div class="glass tool" data-tool="words">📝 Words</div><div class="glass tool" data-tool="google">🔍 Google</div><div class="glass tool" data-tool="youtube">▶️ YouTube</div>

<div class="ad-box"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<div class="modal" id="modal"><div class="glass modal-box"><div class="close" id="close">x</div><h3 id="mTitle">Tool</h3><div id="mBody" style="margin-top:12px"></div></div></div>
<script>
const $=s=>document.getElementById(s);setInterval(()=>{$('time').textContent=new Date().toLocaleTimeString()},1000);
async function fetchW(lat,lon,name){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m&timezone=auto');const d=await r.json();$('temp').textContent=Math.round(d.current.temperature_2m)+'°C';$('city').textContent=name;}catch{}}
function locate(){if(!navigator.geolocation){fetchW(34.0151,71.5249,'Peshawar');return;}navigator.geolocation.getCurrentPosition(p=>fetchW(p.coords.latitude,p.coords.longitude,'Your Location'),()=>fetchW(34.0151,71.5249,'Peshawar'))}locate();
async function searchCity(q){if(!q) return;try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&format=json');const d=await r.json();if(d.results) fetchW(d.results[0].latitude,d.results[0].longitude,d.results[0].name);}catch{}}
$('cityBtn').onclick=()=>searchCity($('cityIn').value);$('cityIn').onkeydown=e=>{if(e.key==='Enter') searchCity(e.target.value)};
const modal=$('modal');$('close').onclick=()=>modal.classList.remove('active');modal.onclick=e=>{if(e.target==modal) modal.classList.remove('active')};
function openTool(t,h){$('mTitle').textContent=t;$('mBody').innerHTML=h;modal.classList.add('active');if(window.afterOpen) setTimeout(window.afterOpen,100)}
document.querySelectorAll('.tool').forEach(el=>{el.onclick=()=>{const tt=el.dataset.tool;
if(tt=='ip'){openTool('My IP','<div class="out" id="ipOut">Loading...</div><button class="btn" onclick="loadIP()">Refresh</button>');window.afterOpen=loadIP;}
if(tt=='pass'){openTool('Password','<input class="input" id="plen" type="number" value="16"><div class="out" id="pout"></div><button class="btn" onclick="genPass()">Generate</button>');window.afterOpen=genPass;}
if(tt=='qr'){openTool('QR Maker','<input class="input" id="qrIn" placeholder="Text"><img id="qrImg" style="background:#fff;padding:8px;border-radius:10px;max-width:100%;margin-top:8px"><button class="btn" onclick="makeQR()">Generate</button>');}
if(tt=='calc'){openTool('Calculator','<input class="input" id="calcIn" placeholder="2+2*5"><div class="out" id="calcOut">--</div><button class="btn" onclick="doCalc()">Calculate</button>');}
if(tt=='age'){openTool('Age Calc','<input class="input" id="ageIn" type="date"><div class="out" id="ageOut"></div><button class="btn" onclick="calcAge()">Calculate</button>');}
if(tt=='words'){openTool('Word Count','<textarea class="input" id="wcIn" rows="4"></textarea><div class="out" id="wcOut"></div><button class="btn" onclick="countW()">Count</button>');}
if(tt=='google'){openTool('Google','<input class="input" id="gIn" placeholder="Search"><button class="btn" onclick="goGoogle()">Search Google</button>');}
if(tt=='youtube'){openTool('YouTube','<input class="input" id="ytIn" placeholder="Search"><button class="btn" onclick="goYT()">Search YouTube</button>');}
}});
function loadIP(){fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{$('ipOut').innerHTML='IP: <b>'+d.ip+'</b>'}).catch(()=>{$('ipOut').textContent='Failed'});}
function genPass(){const len=parseInt($('plen').value)||16;const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%";let p="";for(let i=0;i<len;i++) p+=c[Math.floor(Math.random()*c.length)];$('pout').textContent=p;}
function makeQR(){const v=$('qrIn').value||'PHA';$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(v);}
function doCalc(){try{$('calcOut').textContent=Function('"use strict";return ('+$('calcIn').value+')')();}catch{$('calcOut').textContent='Error';}}
function calcAge(){const d=new Date($('ageIn').value);if(isNaN(d)) return;let age=new Date().getFullYear()-d.getFullYear();$('ageOut').textContent='Age: '+age;}
function countW(){const t=$('wcIn').value;const w=t.trim()?t.trim().split(/\s+/).length:0;$('wcOut').textContent='Words: '+w+' | Chars: '+t.length;}
function goGoogle(){const q=$('gIn').value;if(q) window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');}
function goYT(){const q=$('ytIn').value;if(q) window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank');}
</script>
