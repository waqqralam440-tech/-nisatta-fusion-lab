<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nisatta Fusion Lab</title><style>body{background:#080e14;color:#00ffff;font-family:monospace;text-align:center;padding:20px}.card{border:1px solid #00ffff;border-radius:15px;padding:20px;margin:20px auto;max-width:500px;background:#0f1e2e;box-shadow:0 0 20px #00ffff55}.gold{color:gold;font-size:28px;font-weight:bold}input{width:90%;accent-color:gold}</style></head><body><h1 style="color:#fff;">☀️ NISATTA FUSION LAB</h1><p>Naya Suraj Project</p><div class="card"><h3>⚡ Reactor Control</h3><p>Temp: <span id="t" class="gold">15</span> keV</p><input type="range" min="1" max="30" value="15" oninput="u(this.value)"><p>Power: <span id="p" class="gold">2250</span> MW</p><p id="s" style="color:gold;font-weight:bold;">✅ IGNITION! Reactor IGNITED hai!</p></div><div class="card"><h3>📍 Mission</h3><p>Peshawar me load shedding khatam karna.</p></div><script>function u(v){document.getElementById('t').innerText=v;document.getElementById('p').innerText=v*v*10;let e=document.getElementById('s');if(v>=15){e.innerText="✅ IGNITION! "+v+" keV par IGNITED hai!"}else{e.innerText="⏳ Heating... "+(15-v)+" keV aur chahiye"}}</script></body></html>
