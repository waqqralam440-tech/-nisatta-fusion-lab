<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHA TOOLS OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
body{margin:0;background:#050a14;color:#fff;padding:12px;font-family:sans-serif;min-height:100vh}
.header-glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;max-width:440px;margin:8px auto}
.logo-text{font-family:'Orbitron';font-weight:700;line-height:0.95;font-size:18px}
.search-bar{background:rgba(0,0,0,0.35);border:1.5px solid rgba(120,200,255,0.6);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:8px;min-width:180px;box-shadow:0 0 18px rgba(0,200,255,0.4)}
.apps-label{max-width:440px;margin:22px auto 12px;color:#7fb3c8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px;margin:0 auto}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.18);border-radius:18px;padding:18px 8px 12px;text-align:center;cursor:pointer}
.card p{margin:8px 0 0;font-size:12px}
</style>
</head>
<body>
<div class="header-glass">
<div class="logo-text">PHA<br>TOOLS<br>OS</div>
<div class="search-bar">🔍 Searching for "vide|</div>
</div>
<div class="apps-label">Apps</div>
<div class="grid">
<div class="card" onclick="location.href='https://youtube.com'"><div style="font-size:40px">▶️</div><p>YouTube</p></div>
<div class="card" onclick="location.href='https://tiktok.com'"><div style="font-size:40px">♪</div><p>TikTok</p></div>
<div class="card" onclick="location.href='https://google.com'"><div style="font-size:40px">G</div><p>Google</p></div>
<div class="card" onclick="location.href='https://facebook.com'"><div style="font-size:40px">f</div><p>Facebook</p></div>
<div class="card" onclick="location.href='https://instagram.com'"><div style="font-size:40px">📸</div><p>Instagram</p></div>
<div class="card" onclick="location.href='https://wa.me'"><div style="font-size:40px">✆</div><p>WhatsApp</p></div>
</div>
</body>
</html>
